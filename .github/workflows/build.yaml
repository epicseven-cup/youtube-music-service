name: Build Windows MSI

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger it manually from the Actions tab too

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Add WiX to PATH
        run: echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Install dependencies
        run: npm ci

      - name: Build MSI
        run: npm run make   # replace with your actual build script

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/make/**/*.msi   # adjust path to match your Forge/builder output folder